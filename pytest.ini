[pytest]
# Delete each test's tmp_path folder as the test ends, unless the test's own
# body (pytest's "call" phase) failed: that folder stays, for debugging. An
# error in setup or teardown does not keep it. A session that passes also
# deletes its whole basetemp. Under the default policy ("all") every folder
# stays, and pytest keeps the last three sessions' folders.
tmp_path_retention_policy = failed
