name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN reads the repository and nothing else in every job without
# its own block. The repository's default is write, which the pytest job
# would otherwise hold (persisted by checkout) while it runs PyPI packages
# on pushes to main. Uploading the built database and publish-db's download
# of it from this run use the Actions runtime token, not GITHUB_TOKEN, so
# neither needs the actions scope (tests/test_ci_gates.py pins all of this).
permissions:
  contents: read

jobs:
  python:
    name: pytest · ruff format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff format --check be nz scorecard_db tests pipeline
      # The database is a DERIVED artifact (scorecard_db/build_db.py):
      # built fresh from the committed sources on every run (~4s), then
      # verified deterministic — two builds must agree on the logical
      # content hash before the suite runs against it.
      - run: |
          uv run python -m scorecard_db.build_db data/scorecard.db > "$RUNNER_TEMP/build1.json"
          uv run python -m scorecard_db.build_db /tmp/scorecard-det.db > "$RUNNER_TEMP/build2.json"
          uv run python - <<'EOF'
          import json, os
          a = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "build1.json")))["content_hash"]
          b = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "build2.json")))["content_hash"]
          assert a == b, f"build is nondeterministic: {a} != {b}"
          print("deterministic:", a)
          EOF
        env:
          PYTHONPATH: .
      # NO-DRIFT GATE: the builds and the suite rewrite tracked feeds
      # (lanes, ledger, uk_resolved, populations) as a side effect of
      # ingest — the tree must equal HEAD afterwards, or a committed
      # artifact has gone stale relative to the code that regenerates it.
      - run: git diff --exit-code
      # pypdf + pyyaml are NOT optional extras: the HMT lane's strongest
      # honesty guarantee (every registry title and figure anchor verbatim
      # in the real PDF) runs as a test, and a bare env silently skipped it.
      - run: uv run --with pytest --with hypothesis --with pypdf --with pyyaml --with numpy --with psutil --with rfc8785==0.1.4 --with jsonschema pytest tests/ -q
        env:
          PYTHONPATH: .
      # REPLAY NAMESPACES: every committed event replay (the legacy
      # results/uk/events and each results/uk/replays/<variant>) is re-staged
      # and re-compared from its committed artifacts, every committed release
      # diff is re-rendered, and every sealed namespace must match its
      # receipt byte for byte. Verify the original seals, regenerate in a
      # fresh checkout with its seal files temporarily removed, restore only
      # those files, and require an unchanged tree, including untracked files.
      - name: Replay namespaces regenerate and seals hold
        env:
          PYTHONPATH: .
        run: bash .github/scripts/uk_replay_regenerate.sh
      - run: test -z "$(git status --porcelain)"
      - name: Upload built database
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-db-${{ github.sha }}
          path: data/scorecard.db
          retention-days: 30

  replay-variants:
    # The replay-engine matrix: every certified variant in
    # data/uk/replay_variants.json, in index order, as a JSON list
    # (.github/scripts/uk_replay_engine_matrix.py, the standard library under
    # the runner's own Python, from a checkout of those two files). The index
    # is the only list, so a results pull request adds a variant there alone
    # and edits no workflow. An index the list cannot be built from fails
    # this job, and with it every replay-engine leg, rather than replay fewer.
    name: certified replay variants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      variants: ${{ steps.list.outputs.variants }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/uk_replay_engine_matrix.py
            data/uk/replay_variants.json
          sparse-checkout-cone-mode: false
      - name: List the certified variants
        id: list
        run: |
          set -euo pipefail
          variants=$(python3 -I .github/scripts/uk_replay_engine_matrix.py data/uk/replay_variants.json)
          echo "variants=$variants" >> "$GITHUB_OUTPUT"
          echo "replay-engine matrix: $variants"

  replay-engine:
    # The event replay against each certified variant's own engine, one leg
    # per variant that replay-variants lists: the exact environment from the
    # variant's requirements freeze, the construction guards, and the
    # committed premise and diagnostic files regenerated byte for byte. The
    # legacy variant skips diagnostics. These legs install and run each
    # variant's third-party packages, on pull requests too, so this workflow
    # names no dataset token: the runner receives a secret its job names even
    # in a step that never runs. The real measure-year replay, which needs
    # the token, runs in uk-replay-determinism.yml, on pushes to main only.
    name: replay engine · ${{ matrix.variant }}
    needs: replay-variants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.replay-variants.outputs.variants) }}
    env:
      PYTHONPATH: .
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Read the variant's fields from the index
        run: |
          set -euo pipefail
          field() { python3 -c "import json,sys; d=json.load(open('data/uk/replay_variants.json')); v=[v for v in d['variants'] if v['variant_id']==sys.argv[1]][0]; print(eval(sys.argv[2], {'v': v}))" "$VARIANT" "$1"; }
          echo "REQUIREMENTS=$(field "v['requirements']['path']")" >> "$GITHUB_ENV"
          echo "ENGINE=$(field "v['identity']['packages']['policyengine-uk']['version']")" >> "$GITHUB_ENV"
          echo "RESULT_ROOT=$(field "v['result_root']")" >> "$GITHUB_ENV"
          echo "LEGACY=$(field "v['layout'] == 'legacy_events'")" >> "$GITHUB_ENV"
      - name: Install the variant's exact environment
        run: |
          uv venv --python 3.12 .venv-variant
          uv pip install --python .venv-variant/bin/python -r "$REQUIREMENTS"
          uv pip install --python .venv-variant/bin/python rfc8785==0.1.4 jsonschema
      - name: The installed environment is exactly the variant's
        run: .venv-variant/bin/python -c "from pipeline import uk_replay_variants as rv; rv.verify_installed(rv.get_variant('$VARIANT')); print('installed environment matches $VARIANT')"
      - name: Construction guards on the variant's engine
        run: |
          set -euo pipefail
          for event in autumn_budget_2024 autumn_statement_2023 spring_budget_2024 spring_statement_2025 spring_budget_2023 autumn_budget_2025; do
            .venv-variant/bin/python -m pipeline.compute_uk_event --event "$event" --variant "$VARIANT" --guards > /dev/null
            echo "guards hold: $event"
          done
      # A namespace's premises cover its recorded corpus (CORPUS.json), else
      # the events it holds results for, else every registered replay event
      # (uk_replay_variants.namespace_events).
      - name: Construction premises regenerate
        run: .venv-variant/bin/python -m pipeline.audit_uk_event_premises --namespace "$RESULT_ROOT" --expect-engine "$ENGINE" --output "$RESULT_ROOT/CONSTRUCTION_PREMISES.json" --check
      - name: Re-verified diagnostics regenerate
        if: env.LEGACY == 'False'
        run: |
          set -euo pipefail
          .venv-variant/bin/python pipeline/diagnose_uk_event_models.py --reverify results/uk/events/MODEL_DIAGNOSTICS.json --expect-engine "$ENGINE" --output "$RUNNER_TEMP/MODEL_DIAGNOSTICS.json"
          cmp "$RUNNER_TEMP/MODEL_DIAGNOSTICS.json" "$RESULT_ROOT/MODEL_DIAGNOSTICS.json"
      - name: No real replay on pull requests
        if: env.LEGACY == 'False' && github.event_name != 'push'
        run: echo "::notice::The real replay runs in uk-replay-determinism.yml on pushes to main only; nothing was replayed by the real replay determinism step"

  receiver-sandbox:
    # The receiver's unprivileged candidate account
    # (.github/scripts/uk_replay_sandbox.sh) on a real runner image, with a
    # stub drain that leaves a process behind. No secrets, so it runs on pull
    # requests too: setup checks the account has no sudo, no supplementary
    # groups and no write access to the runner's files; collect must kill
    # everything and bring a guarded output back.
    name: receiver sandbox
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Set up the candidate account and check it
        run: bash .github/scripts/uk_replay_sandbox.sh setup
      # The stub does what a real run needs inside the sandbox (uv and the
      # network, a git worktree of the copy, a multiprocessing pool) and
      # leaves a process behind; it writes probe.json only if all succeed.
      - name: Replace the copy's drain with a stub that exercises a real run
        run: |
          sudo -u replay-candidate tee /home/replay-candidate/scorecard/.github/scripts/uk_replay_drain.sh > /dev/null <<'SH'
          set -euo pipefail
          mkdir -p output/state
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" rfc8785==0.1.4
          git worktree add --detach "$RUNNER_TEMP/checkout" HEAD
          "$RUNNER_TEMP/venv/bin/python" -c 'import multiprocessing as m, rfc8785; assert sum(m.get_context("spawn").Pool(2).map(abs, [-1, -2])) == 3'
          python3 -c 'import json; print(json.dumps({"status": "failed", "receipt_sha256": "a" * 64}))' > output/outcome.json
          echo 0 > output/run-exit.txt
          echo '{"uv_and_network": true, "git_worktree": true, "multiprocessing": true}' > output/probe.json
          nohup sleep 600 > /dev/null 2>&1 &
          SH
      - name: Run the stub as the candidate
        env:
          REQUEST_ID: stub
          REPLAY_RUNNER: ci
        run: bash .github/scripts/uk_replay_sandbox.sh run
      - name: Nothing survives and the guarded output comes back
        run: |
          set -euo pipefail
          bash .github/scripts/uk_replay_sandbox.sh collect
          if pgrep -u replay-candidate; then
            echo "::error::candidate processes survive collect"
            exit 1
          fi
          test "$(stat -c %U output/outcome.json)" = "$(id -un)"
          test -f output/probe.json
          python3 -I .github/scripts/uk_replay_output_guard.py output

  app:
    name: typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test src
      - run: bun run build

  publish-db:
    name: publish db to supabase storage
    needs: python
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scorecard-db-${{ github.sha }}
      # Storage bucket `scorecard-artifacts` on the PE Supabase project:
      # every main commit's built DB (gzipped ~6 MB from ~58 MB — the
      # project is on the free plan, 50 MB per-object cap) at <sha>.db.gz
      # plus a moving latest.db.gz, so consumers fetch + gunzip instead
      # of rebuilding. Skips with a notice until the
      # SUPABASE_SCORECARD_URL/KEY secrets are set.
      #
      # A failed upload is a warning, not a failed run: nothing in this
      # repository reads the published copy, and the built database is
      # already attached to the run as an artifact. Every main run from
      # 6 October 2026 failed here with curl exit 6 (the storage host no
      # longer resolves; the last upload that worked was 28 September),
      # which hid whether main was otherwise green. curl stays silent so
      # the host name in the secret URL is never printed.
      - run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::notice::Supabase secrets not set — skipping publish"
            exit 0
          fi
          gzip -9 -c scorecard.db > scorecard.db.gz
          for name in "${GITHUB_SHA}.db.gz" "latest.db.gz"; do
            status=0
            curl -sf -X POST \
              "$SUPABASE_URL/storage/v1/object/scorecard-artifacts/$name" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Content-Type: application/gzip" \
              -H "x-upsert: true" \
              --data-binary @scorecard.db.gz > /dev/null || status=$?
            if [ "$status" -ne 0 ]; then
              message="curl exit $status uploading scorecard-artifacts/$name: the published database was not updated. This run's built database is its scorecard-db artifact."
              echo "::warning title=Supabase publish failed::$message"
              echo "**Supabase publish failed.** $message" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "uploaded scorecard-artifacts/$name"
          done
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_SCORECARD_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SCORECARD_KEY }}
