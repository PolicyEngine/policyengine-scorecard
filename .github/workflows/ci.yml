name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pytest · ruff format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff format --check be nz scorecard_db tests pipeline
      # The database is a DERIVED artifact (scorecard_db/build_db.py):
      # built fresh from the committed sources on every run (~4s), then
      # verified deterministic — two builds must agree on the logical
      # content hash before the suite runs against it.
      - run: |
          uv run python -m scorecard_db.build_db data/scorecard.db > build1.json
          uv run python -m scorecard_db.build_db /tmp/scorecard-det.db > build2.json
          uv run python - <<'EOF'
          import json
          a = json.load(open("build1.json"))["content_hash"]
          b = json.load(open("build2.json"))["content_hash"]
          assert a == b, f"build is nondeterministic: {a} != {b}"
          print("deterministic:", a)
          EOF
        env:
          PYTHONPATH: .
      # NO-DRIFT GATE: the builds and the suite rewrite tracked feeds
      # (lanes, ledger, uk_resolved, populations) as a side effect of
      # ingest — the tree must equal HEAD afterwards, or a committed
      # artifact has gone stale relative to the code that regenerates it.
      - run: git diff --exit-code
      # pypdf + pyyaml are NOT optional extras: the HMT lane's strongest
      # honesty guarantee (every registry title and figure anchor verbatim
      # in the real PDF) runs as a test, and a bare env silently skipped it.
      - run: uv run --with pytest --with hypothesis --with pypdf --with pyyaml --with numpy --with psutil --with rfc8785==0.1.4 --with jsonschema pytest tests/ -q
        env:
          PYTHONPATH: .
      # REPLAY NAMESPACES: every committed event replay (the legacy
      # results/uk/events and each results/uk/replays/<variant>) is re-staged
      # and re-compared from its committed artifacts, every committed release
      # diff is re-rendered, and every sealed namespace must match its
      # receipt byte for byte. Engine-free; the no-drift gate below fails on
      # any regenerated byte that differs.
      - name: Replay namespaces regenerate and seals hold
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          run() { uv run --with rfc8785==0.1.4 --with jsonschema python "$@"; }
          for root in results/uk/events results/uk/replays/*/; do
            [ -d "$root" ] || continue
            case "$root" in */diffs/) continue ;; esac
            found=0
            for manifest in "$root"/*/RUN_MANIFEST.json; do
              [ -f "$manifest" ] || continue
              found=1
              dir=$(dirname "$manifest"); event=$(basename "$dir")
              run pipeline/stage_uk_event.py --event "$event" --artifact-dir "$dir" > /dev/null
              run pipeline/compare_uk_event.py --event "$event" --staged "$dir/STAGED.jsonl" --output-dir "$dir" > /dev/null
            done
            if [ "$found" = 1 ]; then
              run pipeline/compare_uk_event.py --summary --events-root "$root" > /dev/null
              echo "regenerated $root"
            fi
          done
          for diff in results/uk/replays/diffs/*/; do
            [ -f "$diff/DIFF.json" ] || continue
            base=$(run -c "import json,sys; print(json.load(open(sys.argv[1]))['base']['root'])" "$diff/DIFF.json")
            head=$(run -c "import json,sys; print(json.load(open(sys.argv[1]))['head']['root'])" "$diff/DIFF.json")
            run -m pipeline.diff_uk_event_runs --base "$base" --head "$head" --output-dir "$diff" --check
          done
          run -m pipeline.uk_replay_qualify verify-sealed
      - run: git diff --exit-code
      - name: Upload built database
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-db-${{ github.sha }}
          path: data/scorecard.db
          retention-days: 30

  replay-engine:
    # The event replay against each certified variant's own engine: the
    # exact environment from the variant's requirements freeze, the
    # construction guards, and the committed premise and diagnostic files
    # regenerated byte for byte. With the HUGGING_FACE_TOKEN secret it also
    # replays one real measure-year on the variant's certified dataset and
    # compares the artifact with the committed bytes (replay determinism);
    # without the secret (forks) that step announces it did not run.
    name: replay engine · ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - pe5.0.2_uk2.89.2_populace-uk-2023-dd68c73-4aa4b14-20260619T023711Z
          - pe6.2.6_uk2.125.1_policyengine-uk-data-1.58.0
    env:
      PYTHONPATH: .
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the variant's exact environment
        run: |
          set -euo pipefail
          field() { python3 -c "import json,sys; d=json.load(open('data/uk/replay_variants.json')); v=[v for v in d['variants'] if v['variant_id']==sys.argv[1]][0]; print(eval(sys.argv[2], {'v': v}))" "$VARIANT" "$1"; }
          echo "REQUIREMENTS=$(field "v['requirements']['path']")" >> "$GITHUB_ENV"
          echo "ENGINE=$(field "v['identity']['packages']['policyengine-uk']['version']")" >> "$GITHUB_ENV"
          echo "RESULT_ROOT=$(field "v['result_root']")" >> "$GITHUB_ENV"
          echo "LEGACY=$(field "v['layout'] == 'legacy_events'")" >> "$GITHUB_ENV"
      - run: |
          uv venv --python 3.12 .venv-variant
          uv pip install --python .venv-variant/bin/python -r "$REQUIREMENTS"
          uv pip install --python .venv-variant/bin/python rfc8785==0.1.4 jsonschema
      - name: The installed environment is exactly the variant's
        run: .venv-variant/bin/python -c "from pipeline import uk_replay_variants as rv; rv.verify_installed(rv.get_variant('$VARIANT')); print('installed environment matches $VARIANT')"
      - name: Construction guards on the variant's engine
        run: |
          set -euo pipefail
          for event in autumn_budget_2024 autumn_statement_2023 spring_budget_2024 spring_statement_2025 spring_budget_2023; do
            .venv-variant/bin/python -m pipeline.compute_uk_event --event "$event" --variant "$VARIANT" --guards > /dev/null
            echo "guards hold: $event"
          done
      - name: Construction premises regenerate
        run: .venv-variant/bin/python -m pipeline.audit_uk_event_premises --all --expect-engine "$ENGINE" --output "$RESULT_ROOT/CONSTRUCTION_PREMISES.json" --check
      - name: Re-verified diagnostics regenerate
        if: env.LEGACY == 'False'
        run: |
          set -euo pipefail
          .venv-variant/bin/python pipeline/diagnose_uk_event_models.py --reverify results/uk/events/MODEL_DIAGNOSTICS.json --expect-engine "$ENGINE" --output "$RUNNER_TEMP/MODEL_DIAGNOSTICS.json"
          cmp "$RUNNER_TEMP/MODEL_DIAGNOSTICS.json" "$RESULT_ROOT/MODEL_DIAGNOSTICS.json"
      - name: One real measure-year replays byte for byte
        if: env.LEGACY == 'False'
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HUGGING_FACE_TOKEN:-}" ]; then
            echo "::notice::HUGGING_FACE_TOKEN not available (fork PR or unset secret): the real replay determinism check did NOT run"
            exit 0
          fi
          uv run --with huggingface_hub python - <<'PY'
          import json, os
          from huggingface_hub import hf_hub_download
          d = json.load(open("data/uk/replay_variants.json"))
          v = [v for v in d["variants"] if v["variant_id"] == os.environ["VARIANT"]][0]["identity"]["dataset"]
          print(hf_hub_download(repo_id=v["repo_id"], repo_type=v["repo_type"], filename=v["path"], revision=v["revision"], token=os.environ["HUGGING_FACE_TOKEN"]))
          PY
          key=autumn_budget_2024__private_school_vat_20pct
          .venv-variant/bin/python -m pipeline.compute_uk_event --event autumn_budget_2024 --variant "$VARIANT" \
            --measures "$key" --years 2026 --workers 1 --output-dir "$RUNNER_TEMP/determinism"
          cmp "$RUNNER_TEMP/determinism/${key}_2026.json" "$RESULT_ROOT/autumn_budget_2024/${key}_2026.json"
          echo "replayed $key 2026 byte-identical to the committed artifact"

  app:
    name: typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test src
      - run: bun run build

  publish-db:
    name: publish db to supabase storage
    needs: python
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scorecard-db-${{ github.sha }}
      # Storage bucket `scorecard-artifacts` on the PE Supabase project:
      # every main commit's built DB (gzipped ~6 MB from ~58 MB — the
      # project is on the free plan, 50 MB per-object cap) at <sha>.db.gz
      # plus a moving latest.db.gz, so consumers fetch + gunzip instead
      # of rebuilding. Skips with a notice until the
      # SUPABASE_SCORECARD_URL/KEY secrets are set.
      - run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::notice::Supabase secrets not set — skipping publish"
            exit 0
          fi
          gzip -9 -c scorecard.db > scorecard.db.gz
          for name in "${GITHUB_SHA}.db.gz" "latest.db.gz"; do
            curl -sf -X POST \
              "$SUPABASE_URL/storage/v1/object/scorecard-artifacts/$name" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Content-Type: application/gzip" \
              -H "x-upsert: true" \
              --data-binary @scorecard.db.gz > /dev/null
            echo "uploaded scorecard-artifacts/$name"
          done
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_SCORECARD_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SCORECARD_KEY }}
