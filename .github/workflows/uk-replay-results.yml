name: UK replay results PR

# Proposes a certified qualification's sealed results to main as a pull
# request, as #188 (6.4.1) and #190 (6.5.0) were proposed by hand: the
# request's results and requirements trees byte for byte, the variant record,
# the CI matrix entry, the tests that name the newest certified variant and a
# RELEASE_REPLAY.md paragraph from the receipt's counts
# (.github/scripts/uk_replay_results_pr.sh, pipeline/uk_replay_results_pr.py).
# The receiver's record job dispatches it when a request completes; it can
# also be run by hand for a request id. It has no pull_request trigger.
#
# It reads only committed public results from replay-state, runs main's own
# checks on them and never installs, imports or runs candidate or release
# code. It holds no dataset token. The build step holds no write credential
# at all (contents: read, checkout credentials not persisted). Only after it
# has verified the commit does the job mint a short-lived token for the
# organisation's policyengine GitHub App, scoped to this repository: contents
# and pull-requests to push the branch and open the pull request, workflows
# because the commit adds the variant to ci.yml's matrix (GITHUB_TOKEN can
# never hold workflows). The propose step runs only git, gh and the standard
# library, and pushes exactly the commit the build step reported, to its own
# uk-replay-results/<variant> branch. A pull request opened with GITHUB_TOKEN
# would also start no pull_request run, so it would never carry checks; the
# App's does.
# Nothing here merges: merging stays on the normal gates, CI and an
# independent review.
# https://docs.github.com/en/actions/concepts/security/github_token
# https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "The replay-state request whose certified results to propose (64 hex)"
        required: true

permissions:
  contents: read

concurrency:
  group: uk-replay-results-${{ github.event.inputs.request_id }}
  cancel-in-progress: false

jobs:
  results_pr:
    name: propose certified results to main
    # Only the default branch's builder writes a branch and opens a PR.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Build and verify the results commit, holding no write credential
        id: build
        env:
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          STATE_BRANCH: replay-state
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/uk_replay_results_pr.sh build
      - name: Mint a repository-scoped token to push the branch and open the PR
        id: token
        if: steps.build.outputs.action == 'build'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Push the verified commit and open the pull request
        if: steps.build.outputs.action == 'build'
        env:
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          STATE_BRANCH: replay-state
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BUILT_COMMIT: ${{ steps.build.outputs.commit }}
          BUILT_BRANCH: ${{ steps.build.outputs.branch }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: bash .github/scripts/uk_replay_results_pr.sh propose
