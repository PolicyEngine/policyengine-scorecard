name: UK replay qualification

# Incoming request runs only enqueue, before dispatching an empty drain run.
# Their concurrency groups are unique. Empty manual runs and scheduled drains
# share a workflow concurrency group, held across preparation, run and recording.
# This preserves the persistent queue even when a pending drain is cancelled.
# One request runs per drain, with at most two simulation workers; the recorder
# dispatches another drain while requests remain eligible. Stale runs retry
# after seven hours, with three running attempts maximum.
# Dataset access happens before the candidate job, in a separate job. The
# candidate job has contents: read, no checkout credentials and no dataset token.
# Receipts are pushed before their terminal status names the pushed commit.
# GitHub documents GITHUB_TOKEN-triggered workflow_dispatch runs at:
# https://docs.github.com/en/actions/concepts/security/github_token

on:
  repository_dispatch:
    types: [uk-replay-qualification-request]
  workflow_dispatch:
    inputs:
      request:
        description: "A qualification request (JSON). Empty: drain the queue only."
        required: false
        default: ""
  schedule:
    - cron: "41 */3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.request != '')) && format('uk-replay-enqueue-{0}', github.run_id) || 'uk-replay-drain' }}
  cancel-in-progress: false

env:
  STATE_BRANCH: replay-state
  PYTHONPATH: .

jobs:
  enqueue:
    name: record the request
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.request != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Write the received request
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REQUEST: ${{ toJSON(github.event.client_payload.request) }}
          MANUAL_REQUEST: ${{ github.event.inputs.request }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            printf '%s' "$DISPATCH_REQUEST" > "$RUNNER_TEMP/request.json"
          else
            printf '%s' "$MANUAL_REQUEST" > "$RUNNER_TEMP/request.json"
          fi
      - name: Enqueue with conflict recovery and start a drain
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          DRAIN_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          export REQUEST_FILE="$RUNNER_TEMP/request.json"
          bash .github/scripts/uk_replay_enqueue.sh
          gh workflow run uk-replay.yml --repo "$GITHUB_REPOSITORY" --ref "$DRAIN_REF"

  prepare:
    name: select a request and fetch its dataset
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.request == '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      request_id: ${{ steps.select.outputs.request_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Mark the oldest eligible request running
        id: select
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/uk_replay_prepare.sh
      - name: Fetch and verify the dataset without candidate code
        if: steps.select.outputs.request_id != ''
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
        run: |
          uv run --with rfc8785==0.1.4 --with jsonschema --with huggingface_hub python \
            -m pipeline.uk_replay_qualify fetch-dataset --request input/REQUEST.json \
            --output input/dataset.h5 --result-file input/fetch-result.json
      - name: Hand the verified dataset and request to the candidate job
        if: steps.select.outputs.request_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: replay-input
          path: input/
          if-no-files-found: error
          retention-days: 1

  run:
    name: run one candidate with read permission
    needs: prepare
    if: needs.prepare.outputs.request_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: replay-input
          path: input/
      - name: Run the candidate and preserve logs and outcome
        env:
          REQUEST_ID: ${{ needs.prepare.outputs.request_id }}
          REPLAY_RUNNER: github-actions ${{ runner.os }} ${{ runner.arch }}
        run: bash .github/scripts/uk_replay_drain.sh
      - name: Upload the receipt and results for the recorder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-output
          path: output/
          if-no-files-found: warn
          retention-days: 7

  record:
    name: commit the receipt then terminal status
    needs: [prepare, run]
    if: always() && needs.prepare.outputs.request_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Download the run artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: replay-output
          path: output/
      - name: Record the outcome and continue the queue
        env:
          REQUEST_ID: ${{ needs.prepare.outputs.request_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          DRAIN_REF: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/uk_replay_record.sh
