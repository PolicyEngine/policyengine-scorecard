name: UK replay qualification

# WHY THIS EXISTS
#
# Release qualification in policyengine.py (W4) asks this repository to rerun
# the OBR fiscal-event replay corpus on a candidate model/data pair before it
# is promoted, and to return an artifact-bound receipt. The interface is
# docs/uk_replay/QUALIFICATION_INTERFACE.md; the run is
# pipeline/uk_replay_qualify.py.
#
# GitHub keeps at most one pending run per concurrency group and cancels the
# older pending ones, so a request is first written to the persistent queue
# on the `replay-state` branch (enqueue job, no concurrency group). The drain
# job then runs queued requests one at a time. A scheduled run drains anything
# a cancelled run left behind, and first queues a request for any
# policyengine.py release newer than the newest certified variant whose
# dispatch never arrived (pipeline/uk_replay_discover.py). A request whose
# run died mid-way is retried after the stale bound in
# pipeline/uk_replay_queue.py.
#
# Simulations: one drain job at a time, at most two workers inside it, so
# never more than two simulations at once from this workflow.
#
# Secrets: HUGGING_FACE_TOKEN reads the certified datasets. Without it a
# request is rejected with data_access_failed rather than skipped.

on:
  repository_dispatch:
    types: [uk-replay-qualification-request]
  workflow_dispatch:
    inputs:
      request:
        description: "A qualification request (JSON). Empty: drain the queue only."
        required: false
        default: ""
  schedule:
    - cron: "41 */3 * * *"

permissions:
  contents: write

env:
  STATE_BRANCH: replay-state

jobs:
  enqueue:
    name: record the request
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.request != '')
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: bash .github/scripts/uk_replay_state.sh
      - name: Write the request
        env:
          DISPATCH_REQUEST: ${{ toJSON(github.event.client_payload.request) }}
          MANUAL_REQUEST: ${{ github.event.inputs.request }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            printf '%s' "$DISPATCH_REQUEST" > "$RUNNER_TEMP/request.json"
          else
            printf '%s' "$MANUAL_REQUEST" > "$RUNNER_TEMP/request.json"
          fi
      - run: bash .github/scripts/uk_replay_enqueue.sh "$RUNNER_TEMP/request.json"

  discover:
    name: catch up on undispatched releases
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.request == '')
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: bash .github/scripts/uk_replay_state.sh
      - name: Build requests for releases no request names yet
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
        run: |
          set -euo pipefail
          uv run --with rfc8785==0.1.4 --with jsonschema --with huggingface_hub --with packaging \
            python -m pipeline.uk_replay_discover --state state --work "$RUNNER_TEMP/discover" \
            --output-dir "$RUNNER_TEMP/discovered" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          shopt -s nullglob
          requests=("$RUNNER_TEMP"/discovered/*.json)
          if [ "${#requests[@]}" -gt 0 ]; then
            bash .github/scripts/uk_replay_enqueue.sh "${requests[@]}"
          else
            echo "no undispatched releases"
          fi

  drain:
    name: run queued requests
    needs: [enqueue, discover]
    if: always() && contains(fromJSON('["success", "skipped"]'), needs.enqueue.result) && contains(fromJSON('["success", "skipped"]'), needs.discover.result)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency:
      group: uk-replay-drain
      cancel-in-progress: false
    env:
      PYTHONPATH: .
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: bash .github/scripts/uk_replay_state.sh
      - name: Drain the queue
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
          REPLAY_RUNNER: github-actions ${{ runner.os }} ${{ runner.arch }}
        run: bash .github/scripts/uk_replay_drain.sh
