name: UK replay qualification

# Incoming request runs only enqueue, before dispatching an empty drain run.
# Their concurrency groups are unique. Empty manual runs and scheduled drains
# share a workflow concurrency group, held across discovery, preparation, run
# and recording. Discovery reads wheel metadata without installing release
# code; a separate write job validates its public requests before enqueueing.
# This preserves the persistent queue even when a pending drain is cancelled.
# One request runs per drain, with at most two simulation workers; the recorder
# dispatches another drain while requests remain eligible. Stale runs retry
# after seven hours, with three running attempts maximum.
# The dataset token (the org secret PE_UK_PRIVATE_HF_READ_TOKEN, read-only)
# is used only in workflow_dispatch and repository_dispatch runs: the schedule
# only dispatches a drain. In the run job it is in one step's environment,
# which fetches and verifies the dataset before any candidate code is
# installed. That job has contents: read and no checkout credentials, and
# candidate code runs as an unprivileged account inside a systemd sandbox
# (.github/scripts/uk_replay_sandbox.sh): read-only filesystem except its own
# home, no sudo, no groups, the runner's home inaccessible, other processes
# invisible, and an environment built from nothing. CI's receiver-sandbox job
# checks it on the runner image. Scorecard is public: the dataset and
# anything household-level never leave the runner. setup-uv's cache is off
# everywhere here, so no job saves or restores a cache; the only artifacts are
# discovery metadata, the request and the run's output, checked before the
# upload and again before the recorder commits anything.
# Receipts are pushed before their terminal status names the pushed commit.
# GitHub documents GITHUB_TOKEN-triggered workflow_dispatch runs at:
# https://docs.github.com/en/actions/concepts/security/github_token

on:
  repository_dispatch:
    types: [uk-replay-qualification-request]
  workflow_dispatch:
    inputs:
      request:
        description: "A qualification request (JSON). Empty: discover missed releases and drain."
        required: false
        default: ""
  schedule:
    - cron: "41 */3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.request != '')) && format('uk-replay-enqueue-{0}', github.run_id) || 'uk-replay-drain' }}
  cancel-in-progress: false

env:
  STATE_BRANCH: replay-state
  PYTHONPATH: .

jobs:
  tick:
    name: dispatch a drain on schedule
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start a drain run (workflow_dispatch, no request)
        env:
          GH_TOKEN: ${{ github.token }}
          DRAIN_REF: ${{ github.event.repository.default_branch }}
        run: gh workflow run uk-replay.yml --repo "$GITHUB_REPOSITORY" --ref "$DRAIN_REF"

  enqueue:
    name: record the request
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.request != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Write the received request
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REQUEST: ${{ toJSON(github.event.client_payload.request) }}
          MANUAL_REQUEST: ${{ github.event.inputs.request }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            printf '%s' "$DISPATCH_REQUEST" > "$RUNNER_TEMP/request.json"
          else
            printf '%s' "$MANUAL_REQUEST" > "$RUNNER_TEMP/request.json"
          fi
      - name: Enqueue with conflict recovery and start a drain
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          DRAIN_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          export REQUEST_FILE="$RUNNER_TEMP/request.json"
          bash .github/scripts/uk_replay_enqueue.sh
          gh workflow run uk-replay.yml --repo "$GITHUB_REPOSITORY" --ref "$DRAIN_REF"

  discover:
    name: discover missed release dispatches without running release code
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.request == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      has_metadata: ${{ steps.discover.outputs.has_metadata }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Read the public queue before discovery
        run: bash .github/scripts/uk_replay_discover.sh snapshot
      - name: Discover missed releases from immutable metadata
        id: discover
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.request == ''
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.PE_UK_PRIVATE_HF_READ_TOKEN }}
        run: bash .github/scripts/uk_replay_discover.sh run
      - name: Check public discovery metadata before upload
        id: guard
        run: python3 -I .github/scripts/uk_replay_output_guard.py discovery
      - uses: actions/upload-artifact@v4
        if: steps.guard.outcome == 'success' && steps.discover.outputs.has_metadata == 'true'
        with:
          name: replay-discovery
          path: discovery/
          if-no-files-found: ignore
          retention-days: 1

  discover_enqueue:
    name: validate and enqueue discovered public requests
    needs: discover
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.request == '' && needs.discover.result == 'success' && needs.discover.outputs.has_metadata == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: replay-discovery
          path: discovery/
      - name: Validate every discovered request before writing the queue
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/uk_replay_discover_enqueue.sh

  prepare:
    name: select a request
    needs: discover_enqueue
    # Discovery, artifact transfer or enqueue failure must never strand a
    # request already queued. The drain still selects from replay-state.
    # !cancelled(), not always(): always() is also true in a cancelled run.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.event.inputs.request == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      request_id: ${{ steps.select.outputs.request_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Mark the oldest eligible request running
        id: select
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/uk_replay_prepare.sh
      - name: Hand the request (never the dataset) to the run job
        if: steps.select.outputs.request_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: replay-input
          path: input/REQUEST.json
          if-no-files-found: error
          retention-days: 1

  run:
    name: run one candidate with read permission
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.request_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: replay-input
          path: input/
      - name: Fetch and verify the dataset before any candidate code
        if: contains(fromJSON('["workflow_dispatch", "repository_dispatch"]'), github.event_name)
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.PE_UK_PRIVATE_HF_READ_TOKEN }}
        run: |
          uv run --with rfc8785==0.1.4 --with jsonschema --with huggingface_hub==2.2.0 python \
            -m pipeline.uk_replay_qualify fetch-dataset --request input/REQUEST.json \
            --output input/dataset.h5 --result-file input/fetch-result.json
      - name: Hand a private copy to the unprivileged candidate account
        run: bash .github/scripts/uk_replay_sandbox.sh setup
      - name: Run the candidate and preserve logs and outcome
        env:
          REQUEST_ID: ${{ needs.prepare.outputs.request_id }}
          REPLAY_RUNNER: github-actions ${{ runner.os }} ${{ runner.arch }}
        run: bash .github/scripts/uk_replay_sandbox.sh run
      - name: Stop every candidate process and take its output back
        id: collect
        if: always()
        run: bash .github/scripts/uk_replay_sandbox.sh collect
      - name: Nothing household-level leaves the runner
        id: guard
        if: always()
        run: python3 -I .github/scripts/uk_replay_output_guard.py output
      # A refused output is never uploaded; the recorder then finds no
      # artifact and records the attempt as failed.
      - name: Upload the receipt and results for the recorder
        if: always() && steps.collect.outcome == 'success' && steps.guard.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: replay-output
          path: output/
          if-no-files-found: warn
          retention-days: 7

  record:
    name: commit the receipt then terminal status
    needs: [prepare, run]
    if: always() && needs.prepare.outputs.request_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Download the run artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: replay-output
          path: output/
      # The run job's guard ran beside candidate code; check again here,
      # where nothing of the candidate's has run, before anything reaches the
      # public branch. A refused output is dropped: the recorder then records
      # a failed receipt.
      - name: Nothing household-level reaches the public branch
        run: bash .github/scripts/uk_replay_recheck.sh
      - name: Record the outcome and continue the queue
        env:
          REQUEST_ID: ${{ needs.prepare.outputs.request_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          DRAIN_REF: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/uk_replay_record.sh
