name: UK replay determinism

# One real measure-year of each certified variant that has a committed
# sealed namespace, replayed on the variant's own engine from the certified
# dataset and compared byte for byte with the committed result
# (pipeline/uk_replay_determinism.py). The dataset is private, and the
# read-only org secret PE_UK_PRIVATE_HF_READ_TOKEN fetches it.
#
# This workflow runs on pushes to main only, never on a pull request,
# because the runner receives a secret its job names even in a step that
# never runs: a debug run of ci.yml's pull-request job evaluated this token
# while a skipped step named it. ci.yml runs on pull requests and installs
# and runs each variant's third-party packages, so it names no token.

on:
  push:
    branches: [main]

concurrency:
  group: uk-replay-determinism-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay-variants:
    # Every certified variant in data/uk/replay_variants.json, in index
    # order, exactly as ci.yml's job of the same name lists them.
    name: certified replay variants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      variants: ${{ steps.list.outputs.variants }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/uk_replay_engine_matrix.py
            data/uk/replay_variants.json
          sparse-checkout-cone-mode: false
      - name: List the certified variants
        id: list
        run: |
          set -euo pipefail
          variants=$(python3 -I .github/scripts/uk_replay_engine_matrix.py data/uk/replay_variants.json)
          echo "variants=$variants" >> "$GITHUB_OUTPUT"
          echo "real replay matrix: $variants"

  real-replay:
    # The token step runs before any variant code: only the checkout, uv's
    # setup and a read of the index come before it, so no package from the
    # variant's requirements can have written $GITHUB_ENV or $GITHUB_PATH,
    # or planted a file, that the step then runs. The runner user has
    # passwordless sudo, and the runner holds the job's secrets in memory
    # until the job ends, so the variant's code never runs as that user:
    # its install and its replay run as uk-replay.yml runs a candidate, as
    # an unprivileged account in a systemd sandbox
    # (.github/scripts/uk_replay_sandbox.sh), with no sudo, the runner's
    # processes invisible and its home inaccessible, and only its own home
    # writable. The install has the network and no dataset; the replay has
    # the dataset and no network. Outside the sandbox, this job runs only the
    # runner's own Python, isolated, on standard-library modules: to find the
    # fetched dataset by its digest and to compare the replay that comes
    # back with the committed artifact. A malicious freeze can still make
    # that comparison pass (it can copy the committed artifact) and print
    # what it reads, the dataset included, to this public log; see
    # docs/uk_replay/RELEASE_REPLAY.md. The legacy variant and a variant
    # with no committed sealed namespace replay nothing. The dataset stays
    # on the runner: it is never uploaded or cached.
    name: real replay · ${{ matrix.variant }}
    needs: replay-variants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.replay-variants.outputs.variants) }}
    env:
      PYTHONPATH: .
      VARIANT: ${{ matrix.variant }}
      # The measure-year replayed and the committed artifact it must
      # reproduce, chosen here, outside the sandbox.
      REPLAY_EVENT: autumn_budget_2024
      REPLAY_MEASURE: autumn_budget_2024__private_school_vat_20pct
      REPLAY_YEAR: "2026"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        id: uv
        with:
          enable-cache: false
      - name: Read the variant's fields from the index
        run: |
          set -euo pipefail
          field() { python3 -c "import json,sys; d=json.load(open('data/uk/replay_variants.json')); v=[v for v in d['variants'] if v['variant_id']==sys.argv[1]][0]; print(eval(sys.argv[2], {'v': v}))" "$VARIANT" "$1"; }
          echo "REQUIREMENTS=$(field "v['requirements']['path']")" >> "$GITHUB_ENV"
          echo "RESULT_ROOT=$(field "v['result_root']")" >> "$GITHUB_ENV"
          echo "LEGACY=$(field "v['layout'] == 'legacy_events'")" >> "$GITHUB_ENV"
      # The token is in this step only. It fetches the certified dataset into
      # the Hugging Face hub cache that the next step searches
      # (uk_replay_variants.find_dataset_bytes); the variant's code runs in
      # later steps, in the sandbox, without the token. uv runs by its
      # absolute path in an emptied environment with PATH=/usr/bin:/bin,
      # with no project, config or cache, on /usr/bin/python3 in isolated
      # mode (-I), so nothing in the job's own environment (PYTHONPATH on the
      # checkout, setup-uv's settings) redirects it. Every package it loads
      # is one published by the --exclude-newer date, and the token reaches
      # Python on stdin, never as an argument.
      - name: Fetch the certified dataset for the real replay
        id: fetch
        if: env.LEGACY == 'False'
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.PE_UK_PRIVATE_HF_READ_TOKEN }}
          UV: ${{ steps.uv.outputs.uv-path }}
        run: |
          set -euo pipefail
          if [ -z "${HUGGING_FACE_TOKEN:-}" ]; then
            echo "::notice::PE_UK_PRIVATE_HF_READ_TOKEN unavailable: nothing was replayed by the real replay determinism step"
            exit 0
          fi
          if [ ! -f "$RESULT_ROOT/REPLAY_RECEIPT.json" ] || [ ! -f "$RESULT_ROOT/NAMESPACE_MANIFEST.json" ]; then
            echo "::notice::The variant has no committed sealed namespace: nothing was replayed by the real replay determinism step"
            exit 0
          fi
          printf '%s' "$HUGGING_FACE_TOKEN" | /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" VARIANT="$VARIANT" \
            HF_HUB_CACHE="${HF_HUB_CACHE:-${HF_HOME:-$HOME/.cache/huggingface}/hub}" \
            "$UV" run --no-project --isolated --no-config --no-cache --python /usr/bin/python3 \
            --exclude-newer 2026-10-15T00:00:00Z --with huggingface_hub==2.2.0 python -I -c '
          import json, os, sys
          from huggingface_hub import hf_hub_download
          d = json.load(open("data/uk/replay_variants.json"))
          v = [v for v in d["variants"] if v["variant_id"] == os.environ["VARIANT"]][0]["identity"]["dataset"]
          print(hf_hub_download(repo_id=v["repo_id"], repo_type=v["repo_type"], filename=v["path"], revision=v["revision"], token=sys.stdin.read()))
          '
          echo "fetched=true" >> "$GITHUB_OUTPUT"
      # find_dataset_bytes searches the hub cache the fetch named, by size
      # and SHA-256; the standard library under the runner's own Python.
      - name: Find the fetched dataset by its digest
        if: steps.fetch.outputs.fetched == 'true'
        run: |
          set -euo pipefail
          dataset=$(/usr/bin/python3 -I -c 'import sys; sys.path.insert(0, "."); from pipeline import uk_replay_variants as rv; print(rv.find_dataset_bytes(rv.get_variant(sys.argv[1])))' "$VARIANT")
          echo "DATASET_FILE=$dataset" >> "$GITHUB_ENV"
      - name: Hand a private copy to the unprivileged candidate account
        if: steps.fetch.outputs.fetched == 'true'
        run: bash .github/scripts/uk_replay_sandbox.sh setup
      - name: Install the variant's exact environment in the sandbox
        if: steps.fetch.outputs.fetched == 'true'
        run: bash .github/scripts/uk_replay_sandbox.sh install
      # compute_uk_event's preflight checks the installed environment is
      # exactly the variant's before it simulates anything.
      - name: Replay one real measure-year in the sandbox, offline
        if: steps.fetch.outputs.fetched == 'true'
        run: bash .github/scripts/uk_replay_sandbox.sh replay
      - name: Stop every candidate process and take its output back
        if: always() && steps.fetch.outputs.fetched == 'true'
        run: bash .github/scripts/uk_replay_sandbox.sh collect
      # A namespace sealed before the processed-value check is compared
      # without that check's evidence fields, with a notice
      # (pipeline/uk_replay_determinism.py); every other byte must match.
      - name: One real measure-year replays byte for byte
        if: steps.fetch.outputs.fetched == 'true'
        run: |
          /usr/bin/python3 -E -s -m pipeline.uk_replay_determinism \
            "output/${REPLAY_MEASURE}_${REPLAY_YEAR}.json" "$RESULT_ROOT/$REPLAY_EVENT/${REPLAY_MEASURE}_${REPLAY_YEAR}.json"
