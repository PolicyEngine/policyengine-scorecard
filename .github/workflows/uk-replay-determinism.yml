name: UK replay determinism

# One real measure-year of each certified variant that has a committed
# sealed namespace, replayed on the variant's own engine from the certified
# dataset and compared byte for byte with the committed result
# (pipeline/uk_replay_determinism.py). The dataset is private, and the
# read-only org secret PE_UK_PRIVATE_HF_READ_TOKEN fetches it.
#
# This workflow runs on pushes to main only, never on a pull request,
# because the runner receives a secret its job names even in a step that
# never runs: a debug run of ci.yml's pull-request job evaluated this token
# while a skipped step named it. ci.yml runs on pull requests and installs
# and runs each variant's third-party packages, so it names no token.

on:
  push:
    branches: [main]

concurrency:
  group: uk-replay-determinism-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay-variants:
    # Every certified variant in data/uk/replay_variants.json, in index
    # order, exactly as ci.yml's job of the same name lists them.
    name: certified replay variants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      variants: ${{ steps.list.outputs.variants }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/uk_replay_engine_matrix.py
            data/uk/replay_variants.json
          sparse-checkout-cone-mode: false
      - name: List the certified variants
        id: list
        run: |
          set -euo pipefail
          variants=$(python3 -I .github/scripts/uk_replay_engine_matrix.py data/uk/replay_variants.json)
          echo "variants=$variants" >> "$GITHUB_OUTPUT"
          echo "real replay matrix: $variants"

  real-replay:
    # The token step runs before any variant code: only the checkout, uv's
    # setup and a read of the index come before it, so no package from the
    # variant's requirements can have written $GITHUB_ENV or $GITHUB_PATH,
    # or planted a file, that the step then runs. The order secures that
    # much. The variant's engine still runs later in this job as the runner
    # user, which has passwordless sudo, and the runner holds the job's
    # secrets in memory until the job ends, so a compromised package among
    # the variant's pins could read the token from there. Running the
    # install and the replay as uk-replay.yml runs its candidate, as an
    # unprivileged account (.github/scripts/uk_replay_sandbox.sh), closes
    # that. The legacy variant and a variant with no committed sealed
    # namespace replay nothing. The dataset stays on the runner: it is never
    # uploaded or cached.
    name: real replay · ${{ matrix.variant }}
    needs: replay-variants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.replay-variants.outputs.variants) }}
    env:
      PYTHONPATH: .
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        id: uv
        with:
          enable-cache: false
      - name: Read the variant's fields from the index
        run: |
          set -euo pipefail
          field() { python3 -c "import json,sys; d=json.load(open('data/uk/replay_variants.json')); v=[v for v in d['variants'] if v['variant_id']==sys.argv[1]][0]; print(eval(sys.argv[2], {'v': v}))" "$VARIANT" "$1"; }
          echo "REQUIREMENTS=$(field "v['requirements']['path']")" >> "$GITHUB_ENV"
          echo "RESULT_ROOT=$(field "v['result_root']")" >> "$GITHUB_ENV"
          echo "LEGACY=$(field "v['layout'] == 'legacy_events'")" >> "$GITHUB_ENV"
      # The token is in this step only. It fetches the certified dataset into
      # the Hugging Face hub cache that the replay reads
      # (uk_replay_variants.find_dataset_bytes); the replay runs, in a later
      # step, without the token. uv runs by its absolute path in an emptied
      # environment with PATH=/usr/bin:/bin, with no project, config or
      # cache, on /usr/bin/python3 in isolated mode (-I), so nothing in the
      # job's own environment (PYTHONPATH on the checkout, setup-uv's
      # settings) redirects it. Every package it loads is one published by
      # the --exclude-newer date, and the token reaches Python on stdin,
      # never as an argument.
      - name: Fetch the certified dataset for the real replay
        id: fetch
        if: env.LEGACY == 'False'
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.PE_UK_PRIVATE_HF_READ_TOKEN }}
          UV: ${{ steps.uv.outputs.uv-path }}
        run: |
          set -euo pipefail
          if [ -z "${HUGGING_FACE_TOKEN:-}" ]; then
            echo "::notice::PE_UK_PRIVATE_HF_READ_TOKEN unavailable: nothing was replayed by the real replay determinism step"
            exit 0
          fi
          if [ ! -f "$RESULT_ROOT/REPLAY_RECEIPT.json" ] || [ ! -f "$RESULT_ROOT/NAMESPACE_MANIFEST.json" ]; then
            echo "::notice::The variant has no committed sealed namespace: nothing was replayed by the real replay determinism step"
            exit 0
          fi
          printf '%s' "$HUGGING_FACE_TOKEN" | /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" VARIANT="$VARIANT" \
            HF_HUB_CACHE="${HF_HUB_CACHE:-${HF_HOME:-$HOME/.cache/huggingface}/hub}" \
            "$UV" run --no-project --isolated --no-config --no-cache --python /usr/bin/python3 \
            --exclude-newer 2026-10-15T00:00:00Z --with huggingface_hub==2.2.0 python -I -c '
          import json, os, sys
          from huggingface_hub import hf_hub_download
          d = json.load(open("data/uk/replay_variants.json"))
          v = [v for v in d["variants"] if v["variant_id"] == os.environ["VARIANT"]][0]["identity"]["dataset"]
          print(hf_hub_download(repo_id=v["repo_id"], repo_type=v["repo_type"], filename=v["path"], revision=v["revision"], token=sys.stdin.read()))
          '
          echo "fetched=true" >> "$GITHUB_OUTPUT"
      - name: Install the variant's exact environment
        if: steps.fetch.outputs.fetched == 'true'
        run: |
          uv venv --python 3.12 .venv-variant
          uv pip install --python .venv-variant/bin/python -r "$REQUIREMENTS"
          uv pip install --python .venv-variant/bin/python rfc8785==0.1.4 jsonschema
      # compute_uk_event's preflight checks the installed environment is
      # exactly the variant's before it simulates anything.
      - name: One real measure-year replays byte for byte
        if: steps.fetch.outputs.fetched == 'true'
        run: |
          set -euo pipefail
          key=autumn_budget_2024__private_school_vat_20pct
          .venv-variant/bin/python -m pipeline.compute_uk_event --event autumn_budget_2024 --variant "$VARIANT" \
            --measures "$key" --years 2026 --workers 1 --output-dir .venv-replay-checks/determinism
          # A namespace sealed before the processed-value check is compared
          # without that check's evidence fields, with a notice
          # (pipeline/uk_replay_determinism.py); every other byte must match.
          .venv-variant/bin/python -m pipeline.uk_replay_determinism \
            ".venv-replay-checks/determinism/${key}_2026.json" "$RESULT_ROOT/autumn_budget_2024/${key}_2026.json"
