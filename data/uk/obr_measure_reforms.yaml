  - measure_key: autumn_budget_2024__employer_nics_package
    fiscal_event: Autumn Budget 2024
    obr_description: "Employer National Insurance contributions: Increase rate by 1.2 ppts to 15%, cut the Secondary Threshold to £5,000 until 5 April 2028 and uprate with CPI thereafter, increase Employment Allowance to £10,500, remove the £100,000 Employment Allowance eligibility threshold"
