      - Scottish BGA (current)
    notes: >-
      PE represents the employer rate and weekly secondary threshold (£96 × 52
      = £4,992 in the installed model). It has no Employment Allowance or firm
      entity, so the allowance increase and £100,000 test removal are missing.
      policyengine_uk/parameters/gov/contrib/policyengine/employer_ni/employee_incidence.yaml
