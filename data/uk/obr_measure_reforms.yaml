  - measure_key: efo_march_2026__nics_rise_in_primary_threshold
    fiscal_event: EFO March 2026 re-estimate
    obr_description: "NICs: rise in primary threshold"
    source_table: "3.17: 3.17"
    external_metric: revenue_change
    start_fy: 2022
    computability: partial
    construction: reversal_on_certified_world
    pe_reform:
      gov.hmrc.national_insurance.class_1.thresholds.primary_threshold:
        "2024-01-01.2024-12-31": 223
        "2025-01-01.2025-12-31": 227
        "2026-01-01.2026-12-31": 236
        "2027-01-01.2027-12-31": 241
        "2028-01-01.2028-12-31": 246
        "2029-01-01.2029-12-31": 251
        "2030-01-01.2030-12-31": 256
    heads:
      - obr_head: NICs
        condition_key: null
        pe_variables:
          - ni_class_1_employee
          - ni_class_1_employer
          - ni_class_4
        channel: tax
    unmapped_obr_heads: []
    notes: >-
      Reverses to Table 3.19's published indexed annual primary-threshold path,
      divided by 52 because the installed PE parameter is weekly. Employer
      and Class 4 aggregates remain in the required broad NICs head even when
      their direct deltas are zero. The certified PT starts uprating in 2028,
      so the published Table 3.19 counterfactual can fall below that baseline
      in outer years; those construction-direction changes are retained and
      annotated rather than treated as an assumption-matched reversal.

