        "2024-01-01.2024-12-31": 223
        "2025-01-01.2025-12-31": 227
        "2026-01-01.2026-12-31": 236
        "2027-01-01.2027-12-31": 241
        "2028-01-01.2028-12-31": 246
        "2029-01-01.2029-12-31": 251
        "2030-01-01.2030-12-31": 256
    heads:
      - obr_head: NICs
        condition_key: null
        pe_variables:
          - ni_class_1_employee
          - ni_class_1_employer
          - ni_class_4
        channel: tax
    unmapped_obr_heads: []
    notes: >-
      Reverses to Table 3.19's published indexed annual primary-threshold path,
      divided by 52 because the installed PE parameter is weekly. Employer
      and Class 4 aggregates remain in the required broad NICs head even when
      their direct deltas are zero.

