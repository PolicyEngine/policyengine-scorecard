  - measure_key: autumn_budget_2025__salary_sacrifice_pension_nics_cap
    fiscal_event: Autumn Budget 2025
    obr_description: "Salary Sacrifice: Limit the value of salary sacrificed pension contributions that can receive employee and employer NICs relief to £2,000 per year from 6 April 2029 "
    source_table: Tax Measures (Policy measures database)
    external_metric: revenue_change
    start_fy: 2025
    computability: partial
    construction: reversal_on_certified_world
    pe_reform:
      gov.hmrc.national_insurance.salary_sacrifice_pension_cap:
        "2029-01-01.2030-12-31": 1.0e+100
      gov.contrib.behavioral_responses.salary_sacrifice_broad_base_haircut_rate:
        "2029-01-01.2030-12-31": 0.0
    heads:
      - obr_head: Income tax
        condition_key: tax_head
        pe_variables: [income_tax]
        channel: tax
      - obr_head: NICs
        condition_key: tax_head
        pe_variables:
          - ni_class_1_employee
          - ni_class_1_employer
          - ni_class_4
        channel: tax
    unmapped_obr_heads:
      - Corporation tax (onshore)
      - PSCE in RDEL
      - Scottish BGA (current)
    notes: >-
      PE's exact pre-policy cap is infinity, which standard JSON cannot retain
      in the required run artifact. This construction uses a finite 1e100 cap,
      above any modeled contribution, and sets the model's fixed 0.16%
      broad-base pay-haircut response to zero; code inspection verifies that
      this leaves salary sacrifice uncapped on the modeled data. The certified
      formula otherwise embeds that behavioural incidence assumption, and the
      OBR scores small pre-2029 effects that the direct PE lever cannot produce.

