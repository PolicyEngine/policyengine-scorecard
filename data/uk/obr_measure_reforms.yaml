schema_version: 1
benchmark_class: different_model
calendar_year_proxy: "PolicyEngine calendar year Y proxies OBR FY Y-(Y+1)."
measure_key_rule: >-
  Normalized fiscal event plus a filesystem-safe, sometimes shortened slug of
  the verbatim OBR description; obr_description always retains the verbatim
  source text.
head_definitions:
  income_tax:
    pe_variables: [income_tax]
    channel: tax
    notes: "Gain to the Exchequer is the policy-oriented change in Income Tax."
  national_insurance:
    pe_variables:
      - ni_class_1_employee
      - ni_class_1_employer
      - ni_class_4
    channel: tax
    notes: >-
      OBR NICs counterpart required by the lane brief: Class 1 employee plus
      Class 1 employer plus Class 4. national_insurance is not used because it
      excludes employer NICs and includes Class 2 and Class 3.
  welfare_inside_cap_uc:
    pe_variables: [universal_credit]
    channel: spending
    notes: "Gain to the Exchequer is the negative of the UC spending change."

measures:
  - measure_key: efo_march_2026__pa_and_hrt_freezes
    fiscal_event: EFO March 2026 re-estimate
    obr_description: PA and HRT freezes
    source_table: "3.17: 3.17"
    external_metric: revenue_change
    start_fy: 2022
    computability: expressible
    construction: reversal_on_certified_world
    pe_reform:
      gov.hmrc.income_tax.allowances.personal_allowance.amount:
        "2024-01-01.2024-12-31": 15220
        "2025-01-01.2025-12-31": 15480
        "2026-01-01.2026-12-31": 16070
        "2027-01-01.2027-12-31": 16410
        "2028-01-01.2028-12-31": 16750
        "2029-01-01.2029-12-31": 17090
        "2030-01-01.2030-12-31": 17440
      gov.hmrc.income_tax.rates.uk[1].threshold:
        "2024-01-01.2024-12-31": 45800
        "2025-01-01.2025-12-31": 46600
        "2026-01-01.2026-12-31": 48400
        "2027-01-01.2027-12-31": 49500
        "2028-01-01.2028-12-31": 50500
        "2029-01-01.2029-12-31": 51600
        "2030-01-01.2030-12-31": 52700
      gov.hmrc.income_tax.rates.dividends[1].threshold:
        "2024-01-01.2024-12-31": 45800
        "2025-01-01.2025-12-31": 46600
        "2026-01-01.2026-12-31": 48400
        "2027-01-01.2027-12-31": 49500
        "2028-01-01.2028-12-31": 50500
        "2029-01-01.2029-12-31": 51600
        "2030-01-01.2030-12-31": 52700
    heads:
      - obr_head: Income tax
        condition_key: null
        pe_variables: [income_tax]
        channel: tax
    unmapped_obr_heads: []
    notes: >-
      Reverses the certified freezes using Table 3.19's published
      with-indexation PA and gross HRT path. The PE HRT parameter is a taxable
      band width, so each value is published gross HRT minus published PA.
      The Table 3.17 line bundles several announcement events; no single event
      decomposition is asserted.

