        "2024-01-01.2030-12-31": 150000
    heads:
      - obr_head: Income tax
        condition_key: null
        pe_variables: [income_tax]
        channel: tax
    unmapped_obr_heads: []
    notes: >-
      Reverses £125,140 to the previous £150,000 threshold. Both the main and
      dividend threshold paths are set because PE-UK 2.89.2 stores them
