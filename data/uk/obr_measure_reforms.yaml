      policyengine_uk/variables/contrib/policyengine/employer_ni/employer_ni_fixed_employer_cost_change.py
      adjusts wages holding employer cost fixed. The resulting wage change
      moves employee-side Income Tax and NICs, which is why the PE Income-tax
      head is non-zero.

